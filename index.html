<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生觀察記錄與報告系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            .card { border: none !important; shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i data-lucide="clipboard-list" class="w-8 h-8"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">學生觀察記錄與報告系統</h1>
                    <p class="text-xs text-indigo-200">Student Observation & Assessment System</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="exportData()" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-3 py-1.5 rounded-lg transition shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>匯出資料</span>
                </button>
                <button onclick="importData()" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-3 py-1.5 rounded-lg transition shadow-sm">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span>匯入資料</span>
                </button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="handleImport(event)">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Sidebar: Student List & Controls -->
        <aside class="lg:col-span-4 space-y-6 no-print">
            <!-- Student Management Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                        <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i>
                        <span>學生名單</span>
                    </h2>
                    <button onclick="openAddStudentModal()" class="flex items-center space-x-1 text-sm bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg font-medium transition">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>新增學生</span>
                    </button>
                </div>

                <!-- Search Input -->
                <div class="relative mb-4">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderStudentList()" placeholder="搜尋學生姓名或學號..." class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <!-- Student List -->
                <div id="studentList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                    <!-- Dynamic rendering -->
                </div>
            </div>
        </aside>

        <!-- Main Content Area: Record / Report -->
        <section class="lg:col-span-8 space-y-6">

            <!-- Empty State -->
            <div id="emptyState" class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center text-slate-400">
                <i data-lucide="user-x" class="w-16 h-16 mx-auto mb-4 text-slate-300"></i>
                <h3 class="text-lg font-medium text-slate-600">未選擇學生</h3>
                <p class="text-sm mt-1">請從左側列表中選擇學生，或新增一名學生開始記錄。</p>
            </div>

            <!-- Student Detail Workspace -->
            <div id="workspace" class="hidden space-y-6">

                <!-- Student Info Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex justify-between items-center">
                    <div>
                        <div class="flex items-center space-x-3">
                            <h2 id="currentStudentName" class="text-2xl font-bold text-slate-800">---</h2>
                            <span id="currentStudentGrade" class="px-2.5 py-0.5 text-xs font-semibold bg-indigo-50 text-indigo-600 rounded-full">---</span>
                        </div>
                        <p class="text-sm text-slate-500 mt-1">學號：<span id="currentStudentId">---</span></p>
                    </div>
                    <div class="flex items-center space-x-2 no-print">
                        <button onclick="printReport()" class="flex items-center space-x-1 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium transition">
                            <i data-lucide="printer" class="w-4 h-4"></i>
                            <span>列印報告</span>
                        </button>
                        <button onclick="deleteCurrentStudent()" class="flex items-center space-x-1 text-sm bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-lg font-medium transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                            <span>刪除</span>
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="border-b border-slate-200 no-print">
                    <nav class="flex space-x-8">
                        <button id="tab-records-btn" onclick="switchTab('records')" class="border-b-2 border-indigo-600 py-3 px-1 text-sm font-semibold text-indigo-600 flex items-center space-x-2">
                            <i data-lucide="file-text" class="w-4 h-4"></i>
                            <span>觀察紀錄條目</span>
                        </button>
                        <button id="tab-report-btn" onclick="switchTab('report')" class="border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 flex items-center space-x-2">
                            <i data-lucide="award" class="w-4 h-4"></i>
                            <span>綜合評估報告</span>
                        </button>
                    </nav>
                </div>

                <!-- Tab Content: Observation Records -->
                <div id="tab-records" class="space-y-6">
                    <!-- New Record Input Box -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 no-print">
                        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center space-x-1.5">
                            <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600"></i>
                            <span>新增觀察記錄</span>
                        </h3>
                        <div class="space-y-3">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
                                    <input type="date" id="recordDate" class="w-full text-sm border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">觀察類別</label>
                                    <select id="recordCategory" class="w-full text-sm border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                        <option value="學習態度">學習態度</option>
                                        <option value="社交互動">社交互動</option>
                                        <option value="情緒表現">情緒表現</option>
                                        <option value="生活習慣">生活習慣</option>
                                        <option value="特殊表現">特殊表現</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">觀察內容說明</label>
                                <textarea id="recordContent" rows="3" placeholder="請詳細記錄觀察到的具體行為、情境與事件..." class="w-full text-sm border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                            </div>
                            <div class="flex justify-end">
                                <button onclick="addRecord()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center space-x-1">
                                    <i data-lucide="save" class="w-4 h-4"></i>
                                    <span>儲存紀錄</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Records History List -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <h3 class="text-sm font-bold text-slate-700 mb-4 flex items-center space-x-1.5">
                            <i data-lucide="history" class="w-4 h-4 text-indigo-600"></i>
                            <span>歷史記錄列表</span>
                        </h3>
                        <div id="recordsList" class="space-y-4">
                            <!-- Dynamic observation records -->
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Comprehensive Report -->
                <div id="tab-report" class="hidden space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 print-only">
                        <!-- Report Header -->
                        <div class="text-center border-b border-slate-200 pb-4 mb-6">
                            <h1 class="text-2xl font-bold text-slate-900">學生綜合行為與學習觀察報告</h1>
                            <p class="text-sm text-slate-500 mt-1">評估日期：<span id="reportGeneratedDate">---</span></p>
                        </div>

                        <!-- Report Body -->
                        <div class="space-y-6">
                            <!-- Basic Info Summary -->
                            <div class="grid grid-cols-3 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-100">
                                <div><span class="text-xs text-slate-400 block">學生姓名</span><span id="repName" class="font-medium text-slate-800">---</span></div>
                                <div><span class="text-xs text-slate-400 block">學號</span><span id="repId" class="font-medium text-slate-800">---</span></div>
                                <div><span class="text-xs text-slate-400 block">班級/年級</span><span id="repGrade" class="font-medium text-slate-800">---</span></div>
                            </div>

                            <!-- Rating Dimensions -->
                            <div>
                                <h3 class="text-sm font-bold text-slate-800 mb-3 border-l-4 border-indigo-600 pl-2">表現向度評估</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="border border-slate-200 p-3 rounded-lg">
                                        <div class="flex justify-between text-sm font-medium text-slate-700 mb-1">
                                            <span>學習專注力與態度</span>
                                            <span id="score1-val" class="text-indigo-600">4 / 5</span>
                                        </div>
                                        <input type="range" min="1" max="5" value="4" class="w-full no-print" oninput="updateScore('score1', this.value)">
                                    </div>
                                    <div class="border border-slate-200 p-3 rounded-lg">
                                        <div class="flex justify-between text-sm font-medium text-slate-700 mb-1">
                                            <span>人際互動與團隊合作</span>
                                            <span id="score2-val" class="text-indigo-600">4 / 5</span>
                                        </div>
                                        <input type="range" min="1" max="5" value="4" class="w-full no-print" oninput="updateScore('score2', this.value)">
                                    </div>
                                    <div class="border border-slate-200 p-3 rounded-lg">
                                        <div class="flex justify-between text-sm font-medium text-slate-700 mb-1">
                                            <span>情緒管理與表達</span>
                                            <span id="score3-val" class="text-indigo-600">3 / 5</span>
                                        </div>
                                        <input type="range" min="1" max="5" value="3" class="w-full no-print" oninput="updateScore('score3', this.value)">
                                    </div>
                                    <div class="border border-slate-200 p-3 rounded-lg">
                                        <div class="flex justify-between text-sm font-medium text-slate-700 mb-1">
                                            <span>常規與生活自理</span>
                                            <span id="score4-val" class="text-indigo-600">5 / 5</span>
                                        </div>
                                        <input type="range" min="1" max="5" value="5" class="w-full no-print" oninput="updateScore('score4', this.value)">
                                    </div>
                                </div>
                            </div>

                            <!-- Qualitative Summary -->
                            <div>
                                <h3 class="text-sm font-bold text-slate-800 mb-2 border-l-4 border-indigo-600 pl-2">導師綜合評語與建議</h3>
                                <textarea id="reportSummaryText" rows="5" class="w-full text-sm border border-slate-200 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none no-print" placeholder="根據觀察記錄，撰寫整體總結與輔導建議..."></textarea>
                                <div id="reportSummaryPrint" class="hidden print-only text-sm text-slate-700 whitespace-pre-line leading-relaxed border border-slate-100 p-3 bg-slate-50 rounded-lg"></div>
                            </div>
                        </div>

                        <!-- Teacher Signature Area -->
                        <div class="mt-12 pt-6 border-t border-slate-200 grid grid-cols-2 gap-8 text-sm">
                            <div>
                                <p class="text-slate-500">觀察指導教師簽章：</p>
                                <div class="h-12 border-b border-slate-300"></div>
                            </div>
                            <div>
                                <p class="text-slate-500">家長簽署回應：</p>
                                <div class="h-12 border-b border-slate-300"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Modal: Add Student -->
    <div id="addStudentModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-800">新增學生資料</h3>
                <button onclick="closeAddStudentModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">學生姓名</label>
                    <input type="text" id="newStudentName" placeholder="例如：張小明" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">學號</label>
                    <input type="text" id="newStudentId" placeholder="例如：112001" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">班級 / 年級</label>
                    <input type="text" id="newStudentGrade" placeholder="例如：三年一班" class="w-full text-sm border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeAddStudentModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">取消</button>
                <button onclick="saveStudent()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition">確認新增</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // State
        let students = JSON.parse(localStorage.getItem('sys_students')) || [
            {
                id: '101',
                studentId: '2023001',
                name: '林小宇',
                grade: '五年乙班',
                records: [
                    { id: 'r1', date: '2026-10-15', category: '學習態度', content: '數學分組討論時積極帶領組員分析題目，表現出良好領導力。' },
                    { id: 'r2', date: '2026-10-18', category: '情緒表現', content: '體育課比賽落敗時有些沮喪，但經引導後能快速調整情緒並恭喜對手。' }
                ],
                scores: { score1: 4, score2: 5, score3: 3, score4: 4 },
                summary: '小宇本學期表現優異，團隊合作意識強，能在課堂中保持積極專注。'
            }
        ];
        let currentStudentId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('recordDate').valueToDate = new Date();
            document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('reportGeneratedDate').innerText = new Date().toLocaleDateString('zh-TW');
            renderStudentList();
            if (students.length > 0) {
                selectStudent(students[0].id);
            }
        });

        // Save State
        function saveToStorage() {
            localStorage.setItem('sys_students', JSON.stringify(students));
        }

        // Student List Rendering
        function renderStudentList() {
            const listEl = document.getElementById('studentList');
            const query = document.getElementById('searchInput').value.toLowerCase();
            listEl.innerHTML = '';

            const filtered = students.filter(s => s.name.toLowerCase().includes(query) || s.studentId.toLowerCase().includes(query));

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">查無相關學生</p>`;
                return;
            }

            filtered.forEach(s => {
                const isSelected = s.id === currentStudentId;
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg cursor-pointer transition border ${isSelected ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-slate-100 hover:bg-slate-50'}`;
                item.onclick = () => selectStudent(s.id);
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-sm text-slate-800">${s.name}</span>
                        <span class="text-xs text-slate-400">${s.grade}</span>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-xs text-slate-500">學號: ${s.studentId}</span>
                        <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${s.records.length} 條紀錄</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        // Select Student
        function selectStudent(id) {
            currentStudentId = id;
            renderStudentList();

            const student = students.find(s => s.id === id);
            if (!student) return;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('workspace').classList.remove('hidden');

            // Header Info
            document.getElementById('currentStudentName').innerText = student.name;
            document.getElementById('currentStudentGrade').innerText = student.grade;
            document.getElementById('currentStudentId').innerText = student.studentId;

            // Report Basic Info
            document.getElementById('repName').innerText = student.name;
            document.getElementById('repGrade').innerText = student.grade;
            document.getElementById('repId').innerText = student.studentId;

            // Load Records
            renderRecords(student);

            // Load Report Scores & Summary
            const scores = student.scores || { score1: 3, score2: 3, score3: 3, score4: 3 };
            for (let i = 1; i <= 4; i++) {
                const val = scores[`score${i}`] || 3;
                document.getElementById(`score${i}-val`).innerText = `${val} / 5`;
                document.querySelectorAll(`input[type=range]`)[i - 1].value = val;
            }
            document.getElementById('reportSummaryText').value = student.summary || '';
            document.getElementById('reportSummaryPrint').innerText = student.summary || '尚無總結評語。';

            // Auto-save summary input
            document.getElementById('reportSummaryText').oninput = (e) => {
                student.summary = e.target.value;
                document.getElementById('reportSummaryPrint').innerText = e.target.value;
                saveToStorage();
            };
        }

        // Add Record
        function addRecord() {
            if (!currentStudentId) return;
            const date = document.getElementById('recordDate').value;
            const category = document.getElementById('recordCategory').value;
            const content = document.getElementById('recordContent').value.trim();

            if (!content) {
                alert('請輸入觀察內容說明！');
                return;
            }

            const student = students.find(s => s.id === currentStudentId);
            student.records.unshift({
                id: Date.now().toString(),
                date,
                category,
                content
            });

            saveToStorage();
            renderRecords(student);
            renderStudentList();
            document.getElementById('recordContent').value = '';
        }

        // Render Records
        function renderRecords(student) {
            const container = document.getElementById('recordsList');
            container.innerHTML = '';

            if (student.records.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">目前尚無觀察記錄</p>`;
                return;
            }

            student.records.forEach(r => {
                const card = document.createElement('div');
                card.className = "p-4 bg-slate-50 rounded-lg border border-slate-200 relative group";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">${r.category}</span>
                            <span class="text-xs text-slate-400">${r.date}</span>
                        </div>
                        <button onclick="deleteRecord('${r.id}')" class="text-slate-400 hover:text-rose-600 no-print">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-sm text-slate-700 leading-relaxed">${r.content}</p>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // Delete Record
        function deleteRecord(recordId) {
            const student = students.find(s => s.id === currentStudentId);
            student.records = student.records.filter(r => r.id !== recordId);
            saveToStorage();
            renderRecords(student);
            renderStudentList();
        }

        // Update Score
        function updateScore(scoreKey, val) {
            const student = students.find(s => s.id === currentStudentId);
            if (!student.scores) student.scores = {};
            student.scores[scoreKey] = parseInt(val);
            document.getElementById(`${scoreKey}-val`).innerText = `${val} / 5`;
            saveToStorage();
        }

        // Tab Switching
        function switchTab(tab) {
            const recordsTab = document.getElementById('tab-records');
            const reportTab = document.getElementById('tab-report');
            const btnRecords = document.getElementById('tab-records-btn');
            const btnReport = document.getElementById('tab-report-btn');

            if (tab === 'records') {
                recordsTab.classList.remove('hidden');
                reportTab.classList.add('hidden');
                btnRecords.className = "border-b-2 border-indigo-600 py-3 px-1 text-sm font-semibold text-indigo-600 flex items-center space-x-2";
                btnReport.className = "border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 flex items-center space-x-2";
            } else {
                recordsTab.classList.add('hidden');
                reportTab.classList.remove('hidden');
                btnReport.className = "border-b-2 border-indigo-600 py-3 px-1 text-sm font-semibold text-indigo-600 flex items-center space-x-2";
                btnRecords.className = "border-b-2 border-transparent py-3 px-1 text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 flex items-center space-x-2";
            }
        }

        // Modal Controls
        function openAddStudentModal() {
            document.getElementById('addStudentModal').classList.remove('hidden');
            document.getElementById('addStudentModal').classList.add('flex');
        }
        function closeAddStudentModal() {
            document.getElementById('addStudentModal').classList.add('hidden');
            document.getElementById('addStudentModal').classList.remove('flex');
        }
        function saveStudent() {
            const name = document.getElementById('newStudentName').value.trim();
            const studentId = document.getElementById('newStudentId').value.trim();
            const grade = document.getElementById('newStudentGrade').value.trim();

            if (!name || !studentId) {
                alert('請填寫學生姓名與學號！');
                return;
            }

            const newStudent = {
                id: Date.now().toString(),
                studentId,
                name,
                grade: grade || '未指定班級',
                records: [],
                scores: { score1: 3, score2: 3, score3: 3, score4: 3 },
                summary: ''
            };

            students.push(newStudent);
            saveToStorage();
            closeAddStudentModal();
            selectStudent(newStudent.id);

            // Clear inputs
            document.getElementById('newStudentName').value = '';
            document.getElementById('newStudentId').value = '';
            document.getElementById('newStudentGrade').value = '';
        }

        function deleteCurrentStudent() {
            if (!confirm('確定要刪除這位學生的所有紀錄嗎？此動作無法復原。')) return;
            students = students.filter(s => s.id !== currentStudentId);
            saveToStorage();
            currentStudentId = null;
            renderStudentList();

            if (students.length > 0) {
                selectStudent(students[0].id);
            } else {
                document.getElementById('workspace').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        // Print Report
        function printReport() {
            switchTab('report');
            setTimeout(() => {
                window.print();
            }, 200);
        }

        // Data Export / Import
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(students, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `student_records_${new Date().toISOString().split('T')[0]}.json`);
            dlAnchorElem.click();
        }

        function importData() {
            document.getElementById('importFile').click();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        students = imported;
                        saveToStorage();
                        renderStudentList();
                        if (students.length > 0) selectStudent(students[0].id);
                        alert('成功匯入學生紀錄資料！');
                    } else {
                        alert('匯入的檔案格式不正確。');
                    }
                } catch (err) {
                    alert('讀取檔案失敗：' + err.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
